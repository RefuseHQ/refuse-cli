name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # publish release + upload artifacts
  id-token: write       # OIDC keyless cosign signing
  attestations: write   # SLSA build provenance

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.21"
          cache: true

      # Tooling for signing + SBOM
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: Install rcodesign (Apple code-sign + notarize CLI)
        run: |
          version=0.29.0
          archive=apple-codesign-${version}-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${version}/${archive}" \
            | tar -xz -C /tmp
          sudo install /tmp/apple-codesign-${version}-x86_64-unknown-linux-musl/rcodesign /usr/local/bin/rcodesign
          rcodesign --version

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          version: latest
          args: release --clean
        env:
          # The release on RefuseHQ/refuse-cli itself is created via the
          # default workflow token — it only needs contents:write on this
          # repo and the github-actions bot has that.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The cask push to RefuseHQ/homebrew-tap needs a cross-repo PAT.
          # `.goreleaser.yaml`'s `homebrew_casks.repository.token` template
          # reads this env var.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Read by scripts/sign-macos.sh, invoked from goreleaser's
          # builds.hooks.post. Absent → script no-ops.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}

      - name: Notarize darwin binaries
        if: env.MACOS_NOTARY_KEY != ''
        run: ./scripts/notarize-macos.sh dist
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
