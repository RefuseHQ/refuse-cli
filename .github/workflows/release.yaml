name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # publish release + upload artifacts
  id-token: write       # OIDC keyless cosign signing
  attestations: write   # SLSA build provenance

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.21"
          cache: true

      # Tooling for signing + SBOM
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          version: latest
          args: release --clean
        env:
          # The release on RefuseHQ/refuse-cli itself is created via the
          # default workflow token — it only needs contents:write on this
          # repo and the github-actions bot has that.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The cask push to RefuseHQ/homebrew-tap needs a cross-repo PAT.
          # `.goreleaser.yaml`'s `homebrew_casks.repository.token` template
          # reads this env var.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Apple Developer ID signing + notarization. The MACOS_SIGN_P12
          # and MACOS_NOTARY_KEY secrets hold base64-encoded blobs of the
          # .p12 cert and .p8 notary API key. goreleaser's `notarize.macos`
          # block decodes them. Absent secrets → block is `enabled: false`
          # and the step becomes a no-op.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
