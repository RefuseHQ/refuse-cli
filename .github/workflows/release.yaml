name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # publish release + upload artifacts
  id-token: write       # OIDC keyless cosign signing
  attestations: write   # SLSA build provenance

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      # Tooling for signing + SBOM
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal access token with write to RefuseHQ/homebrew-tap, expose
          # as repo secret HOMEBREW_TAP_TOKEN before tagging a release.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-checksums: dist/checksums.txt
