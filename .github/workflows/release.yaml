name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # publish release + upload artifacts
  id-token: write       # OIDC keyless cosign signing
  attestations: write   # SLSA build provenance

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.21"
          cache: true

      # Tooling for signing + SBOM
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v7
        id: goreleaser
        with:
          version: latest
          args: release --clean
        env:
          # The release on RefuseHQ/refuse-cli itself is created via the
          # default workflow token — it only needs contents:write on this
          # repo and the github-actions bot has that.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The cask push to RefuseHQ/homebrew-tap needs a cross-repo PAT.
          # `.goreleaser.yaml`'s `homebrew_casks.repository.token` template
          # reads this env var.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
