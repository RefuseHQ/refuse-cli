version: 2

project_name: refuse

before:
  hooks:
    - go mod tidy

builds:
  - id: refuse
    main: ./cmd/refuse
    binary: refuse
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/RefuseHQ/refuse-cli/internal/version.Version={{.Version}}
      - -X github.com/RefuseHQ/refuse-cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/RefuseHQ/refuse-cli/internal/version.Date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: RefuseHQ
    name: refuse-cli
  draft: true

brews:
  - repository:
      owner: RefuseHQ
      name: homebrew-tap
    homepage: https://refuse.dev
    description: Gate AI coding agents from installing vulnerable packages
    license: Apache-2.0
    test: |
      system "#{bin}/refuse", "--version"
