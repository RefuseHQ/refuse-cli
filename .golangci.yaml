# golangci-lint v2 config — https://golangci-lint.run/usage/configuration/
#
# v2 changes vs the previous v1 config:
#   - `version: "2"` is required.
#   - `linters.disable-all: true` → `linters.default: none`.
#   - `linters-settings:` moved under `linters.settings:`.
#   - `issues.exclude-rules:` moved under `linters.exclusions.rules:`.
#   - `gosimple` collapsed into `staticcheck`.
#   - `gofmt` / `goimports` moved out of `linters` into a top-level `formatters:` block.

version: "2"

run:
  timeout: 5m
  go: "1.21"
  tests: true

linters:
  default: none
  enable:
    # built-in / default
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # extras worth having
    - bodyclose
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - misspell
    - nakedret
    - nolintlint
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    revive:
      rules:
        - name: package-comments
          disabled: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    gocritic:
      disabled-checks:
        - ifElseChain
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/RefuseHQ/refuse-cli

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
